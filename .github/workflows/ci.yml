name: CI

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests, Pint and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, bcmath, gd, zip, pdo_sqlite, pdo_mysql
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Production caches build (routes, config, views, events)
        # CI has no MySQL server; optimize:clear also flushes the cache store.
        env:
          CACHE_STORE: file
        run: |
          php artisan optimize
          php artisan optimize:clear

      - name: Dependency security audit (PHP)
        run: composer audit --locked --no-dev

      - name: Dependency security audit (JS, runtime only)
        run: npm audit --omit=dev
